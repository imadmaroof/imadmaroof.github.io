<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOUR NAME &mdash; Overworld</title>
<meta name="description" content="Placeholder description. A 16-bit style portfolio overworld — pick a world to see a project.">

<!-- EDIT: your name / site title in the tab, above. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235c94fc'/%3E%3Crect x='2' y='3' width='12' height='11' fill='%23241c2c'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%2339c5bb'/%3E%3Crect x='5' y='7' width='2' height='3' fill='%23fff'/%3E%3Crect x='9' y='7' width='2' height='3' fill='%23fff'/%3E%3C/svg%3E">
</head>

<body class="overworld">

<!-- ======================================================================
     HUD — classic status bar. Same markup on every page.
     EDIT: your name, and the nav links.
     ====================================================================== -->
<header class="hud">
  <a class="hud__name" href="index.html">YOUR <span>NAME</span></a>

  <span class="hud__coins" title="Coins collected on the map">
    <svg class="coin-icon pixel" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="3" y="1" width="10" height="14" class="px-ink"/>
      <rect x="2" y="3" width="12" height="10" class="px-ink"/>
      <rect x="4" y="2" width="8" height="12" class="px-gold"/>
      <rect x="3" y="4" width="10" height="8" class="px-gold"/>
      <rect x="5" y="3" width="3" height="10" class="px-gold-hi"/>
      <rect x="10" y="4" width="2" height="8" class="px-gold-lo"/>
      <rect x="7" y="5" width="2" height="6" class="px-gold-deep"/>
    </svg>
    <span class="sr-only">Coins:</span>&times;<span data-coin-count>00</span>
  </span>

  <span class="hud__spacer"></span>

  <nav class="hud__nav" aria-label="Main">
    <a href="pages/about.html" data-warp>ABOUT</a>
    <a href="pages/about.html#resume" data-warp>RESUME</a>
    <a href="pages/contact.html" data-warp>CONTACT</a>
    <button type="button" class="hud__toggle" data-sound-toggle aria-pressed="false">SFX OFF</button>
  </nav>
</header>

<!-- ======================================================================
     THE OVERWORLD (desktop / tablet, 768px and up)
     Every node, coin and path segment below is generated by js/map.js from
     the array in js/projects.js. There is nothing to hand-place here.
     ====================================================================== -->
<main id="map-viewport" class="map-viewport" aria-label="Overworld map">
  <div id="map-canvas" class="map-canvas">

    <!-- backdrop, back to front -->
    <div class="layer-dither" aria-hidden="true"></div>
    <div id="layer-clouds-far"  class="layer-clouds layer-clouds--far"  aria-hidden="true"></div>
    <div id="layer-clouds-near" class="layer-clouds layer-clouds--near" aria-hidden="true"></div>
    <div id="layer-hills" class="layer-hills" aria-hidden="true"></div>
    <div id="layer-land"  class="layer-land"  aria-hidden="true"></div>

    <!-- the winding dotted path -->
    <svg id="layer-path" class="layer-path" aria-hidden="true" preserveAspectRatio="none">
      <polyline id="path-edge"   class="path-edge"></polyline>
      <polyline id="path-shadow" class="path-shadow"></polyline>
      <polyline id="path-dots"   class="path-dots"></polyline>
    </svg>

    <!-- castle at the end of the road -> contact page -->
    <a id="castle" class="castle" href="pages/contact.html" aria-label="Castle — go to the contact page">
      <svg viewBox="0 0 48 48" shape-rendering="crispEdges" aria-hidden="true">
        <!-- central spire -->
        <rect x="19" y="0"  width="10" height="5"  class="px-ink"/>
        <rect x="20" y="1"  width="3"  height="4"  class="px-stone"/>
        <rect x="25" y="1"  width="3"  height="4"  class="px-stone"/>
        <rect x="19" y="4"  width="10" height="13" class="px-ink"/>
        <rect x="20" y="5"  width="8"  height="12" class="px-stone"/>
        <rect x="20" y="5"  width="2"  height="12" class="px-stone-hi"/>
        <rect x="26" y="5"  width="2"  height="12" class="px-stone-lo"/>
        <rect x="23" y="8"  width="2"  height="4"  class="px-stone-deep"/>

        <!-- main keep: merlon band -->
        <rect x="9"  y="11" width="30" height="6"  class="px-ink"/>
        <rect x="10" y="12" width="4"  height="4"  class="px-stone"/>
        <rect x="16" y="12" width="4"  height="4"  class="px-stone"/>
        <rect x="22" y="12" width="4"  height="4"  class="px-stone"/>
        <rect x="28" y="12" width="4"  height="4"  class="px-stone"/>
        <rect x="34" y="12" width="4"  height="4"  class="px-stone"/>

        <!-- main keep: body -->
        <rect x="9"  y="16" width="30" height="32" class="px-ink"/>
        <rect x="10" y="17" width="28" height="31" class="px-stone"/>
        <rect x="10" y="17" width="3"  height="31" class="px-stone-hi"/>
        <rect x="35" y="17" width="3"  height="31" class="px-stone-lo"/>
        <rect x="14" y="21" width="5"  height="6"  class="px-ink"/>
        <rect x="15" y="22" width="3"  height="4"  class="px-stone-deep"/>
        <rect x="29" y="21" width="5"  height="6"  class="px-ink"/>
        <rect x="30" y="22" width="3"  height="4"  class="px-stone-deep"/>

        <!-- brick base + doorway -->
        <rect x="10" y="40" width="28" height="8"  class="px-brick"/>
        <rect x="10" y="44" width="28" height="4"  class="px-brick-lo"/>
        <rect x="19" y="31" width="10" height="17" class="px-ink"/>
        <rect x="20" y="33" width="8"  height="15" class="px-stone-deep"/>
        <rect x="22" y="32" width="4"  height="2"  class="px-stone-deep"/>
        <rect x="23" y="39" width="2"  height="3"  class="px-gold"/>

        <!-- left tower -->
        <rect x="1"  y="9"  width="10" height="5"  class="px-ink"/>
        <rect x="2"  y="10" width="3"  height="4"  class="px-stone"/>
        <rect x="7"  y="10" width="3"  height="4"  class="px-stone"/>
        <rect x="1"  y="13" width="10" height="35" class="px-ink"/>
        <rect x="2"  y="14" width="8"  height="34" class="px-stone"/>
        <rect x="2"  y="14" width="2"  height="34" class="px-stone-hi"/>
        <rect x="8"  y="14" width="2"  height="34" class="px-stone-lo"/>
        <rect x="4"  y="19" width="4"  height="5"  class="px-stone-deep"/>
        <rect x="2"  y="42" width="8"  height="6"  class="px-brick"/>

        <!-- right tower -->
        <rect x="37" y="9"  width="10" height="5"  class="px-ink"/>
        <rect x="38" y="10" width="3"  height="4"  class="px-stone"/>
        <rect x="43" y="10" width="3"  height="4"  class="px-stone"/>
        <rect x="37" y="13" width="10" height="35" class="px-ink"/>
        <rect x="38" y="14" width="8"  height="34" class="px-stone"/>
        <rect x="38" y="14" width="2"  height="34" class="px-stone-hi"/>
        <rect x="44" y="14" width="2"  height="34" class="px-stone-lo"/>
        <rect x="40" y="19" width="4"  height="5"  class="px-stone-deep"/>
        <rect x="38" y="42" width="8"  height="6"  class="px-brick"/>
      </svg>
      <span class="castle__label">CASTLE &middot; CONTACT</span>
    </a>

    <!-- the player sprite; markup is injected by js/map.js -->
    <div id="player" class="player pixel" aria-hidden="true"></div>

  </div>
</main>

<!-- controls legend -->
<p class="map-hint" aria-hidden="true">
  <span><kbd>ARROWS</kbd> MOVE</span>
  <span><kbd>ENTER</kbd> ENTER PIPE</span>
  <span>OR JUST CLICK A WORLD</span>
</p>

<!-- status line for screen readers -->
<p id="map-status" class="sr-only" role="status" aria-live="polite"></p>

<!-- ======================================================================
     MOBILE LEVEL SELECT (below 768px)
     Same PROJECTS array, rendered as a plain readable vertical list.
     ====================================================================== -->
<section class="level-select" aria-label="Level select">
  <div class="level-select__inner">
    <h1 class="level-select__title">LEVEL SELECT</h1>
    <div id="level-select-list"></div>
    <p class="site-foot">
      <a href="pages/about.html">ABOUT</a> &middot;
      <a href="pages/contact.html">CONTACT</a>
    </p>
  </div>
</section>

<script src="js/projects.js"></script>
<script src="js/site.js"></script>
<script src="js/map.js"></script>
</body>
</html>
